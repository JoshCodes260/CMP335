
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Registration System</a>
        <div class="navbar-nav">
            <a class="nav-link" href="index.html">Students</a>
            <a class="nav-link" href="faculty.html">Faculty</a>
            <a class="nav-link active" href="courses.html">Courses</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h1 class="fw-bold">Courses</h1>
    <p class="text-muted">Manage courses and faculty assignments.</p>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Add or Update Course</h5>
        </div>
        <div class="card-body">
            <form id="courseForm">
                <input type="hidden" id="courseId">

                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Course Number</label>
                        <input type="text" class="form-control" id="courseNumber"
                               placeholder="CMP335" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Course Name</label>
                        <input type="text" class="form-control" id="courseName"
                               placeholder="Web Development">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Faculty ID</label>
                        <input type="number" class="form-control" id="facultyId"
                               placeholder="Faculty ID" min="1" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Enrollment Limit</label>
                        <input type="number" class="form-control" id="enrollmentLimit"
                               placeholder="25" min="0">
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">Save Course</button>
                    <button type="button" class="btn btn-secondary" onclick="clearForm()">Clear</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h5 class="mb-0">Find Course</h5>
        </div>
        <div class="card-body">
            <input type="number" class="form-control mb-3" id="searchId"
                   placeholder="Enter Course ID" min="1">
            <button class="btn btn-primary" onclick="searchCourse()">Search</button>
            <button class="btn btn-outline-secondary" onclick="getCourses()">Show All</button>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h5 class="mb-0">Faculty Schedule</h5>
        </div>
        <div class="card-body">
            <input type="number" class="form-control mb-3" id="scheduleId"
                   placeholder="Enter Faculty ID" min="1">
            <button class="btn btn-primary" onclick="getFacultyCourses()">
                View Schedule
            </button>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Courses</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Course Number</th>
                            <th>Course Name</th>
                            <th>Faculty</th>
                            <th>Enrollment Limit</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="courseTable"></tbody>
                </table>
            </div>
            <p id="message" role="status" aria-live="polite"></p>
        </div>
    </div>
</div>

<script src="courses.js"></script>
</body>
</html>
