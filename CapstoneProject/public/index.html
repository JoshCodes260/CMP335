
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Student Management System
            </span>
        </div>
    </nav>

    <div class="container my-5">

        <!-- Page Heading -->
        <div class="mb-4">
            <h1 class="fw-bold">Students</h1>
            <p class="text-muted">Manage student records and information.</p>
        </div>

        <!-- Add or Update Student -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Add or Update Student</h5>
            </div>

            <div class="card-body">
                <form id="studentForm">
                    <input type="hidden" id="studentId">

                    <div class="row g-3">

                        <div class="col-md-4">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control"
                                   id="firstName" placeholder="First Name" required>
                        </div>

                        <div class="col-md-4">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control"
                                   id="lastName" placeholder="Last Name" required>
                        </div>

                        <div class="col-md-4">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control"
                                   id="email" placeholder="Email Address">
                        </div>

                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">
                            Save Student
                        </button>

                        <button type="button" class="btn btn-secondary"
                                onclick="clearForm()">
                            Clear
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Search Student -->
        <div class="card shadow-sm mb-4">
            <div class="card-header">
                <h5 class="mb-0">Find Student</h5>
            </div>

            <div class="card-body">
                <div class="row g-2 align-items-end">

                    <div class="col-md-8">
                        <label for="searchId" class="form-label">Student ID</label>
                        <input type="number" class="form-control"
                               id="searchId" placeholder="Enter Student ID" min="1">
                    </div>

                    <div class="col-md-4">
                        <button class="btn btn-primary" onclick="searchStudent()">
                            Search
                        </button>

                        <button class="btn btn-outline-secondary" onclick="getStudents()">
                            Show All
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <!-- Student Table -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">All Students</h5>
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Email</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="studentTable"></tbody>
                    </table>
                </div>

                <p id="message" class="mt-3 fw-semibold" role="status" aria-live="polite"></p>
            </div>
        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
