
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Registration System</a>
        <div class="navbar-nav">
            <a class="nav-link" href="index.html">Students</a>
            <a class="nav-link active" href="faculty.html">Faculty</a>
            <a class="nav-link" href="courses.html">Courses</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h1 class="fw-bold">Faculty</h1>
    <p class="text-muted">Manage faculty records and information.</p>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Add or Update Faculty</h5>
        </div>
        <div class="card-body">
            <form id="facultyForm">
                <input type="hidden" id="facultyId">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email">
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">Save Faculty</button>
                    <button type="button" class="btn btn-secondary" onclick="clearForm()">Clear</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h5 class="mb-0">Find Faculty</h5>
        </div>
        <div class="card-body">
            <input type="number" class="form-control mb-3" id="searchId"
                   placeholder="Enter Faculty ID" min="1">
            <button class="btn btn-primary" onclick="searchFaculty()">Search</button>
            <button class="btn btn-outline-secondary" onclick="getFaculty()">Show All</button>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">All Faculty</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="facultyTable"></tbody>
                </table>
            </div>
            <p id="message" role="status" aria-live="polite"></p>
        </div>
    </div>
</div>

<script src="faculty.js"></script>
</body>
</html>
