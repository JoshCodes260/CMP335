
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hip-Hop Artists</title>
    <link rel="stylesheet" href="collect.css">
</head>

<body>

    <h1>Hip-Hop Artist Collection</h1>

    <h2>All Artists</h2>
    <div id="artistList"></div>

    <h2>Add New Artist</h2>

    <form id="artistForm">
        <input type="text" id="name" placeholder="Artist Name" required minlength="3">
        <input type="text" id="album" placeholder="Album" required>
        <input type="text" id="hitSong" placeholder="Hit Song" required>

        <button type="submit">Add Artist</button>
    </form>

    <script src="collect1.js"></script>

</body>
</html>
