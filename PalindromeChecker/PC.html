<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Palindrome Checker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="PC.css">

    <script src="PC.js"></script>

</head>

<body>

    <div class="container py-5">

        <h1 class="mb-5">Palindrome Checker</h1>

        <div class="row g-4">


            <!-- Form -->
            <div class="col-lg-3 col-md-6">

                <h2>Palindrome Checker Form</h2>

                <form name="rangeForm">

                    <label>Word to check:</label>

                    <input type="text"
                           name="newWord"
                           class="form-control">

                    <br>


                    <label>Algorithm to use:</label>

                    <select name="algorithm"
                            class="form-select">

                        <option value="" disabled selected>
                            Select an algorithm
                        </option>

                        <option value="1">
                            Algorithm 1
                        </option>

                        <option value="2">
                            Algorithm 2
                        </option>

                        <option value="3">
                            Algorithm 3
                        </option>

                    </select>

                    <br>


                    <label>Case sensitivity:</label>

                    <select name="caseChoice"
                            class="form-select">

                        <option value="" disabled selected>
                            Select an option
                        </option>

                        <option value="sensitive">
                            Case Sensitive
                        </option>

                        <option value="insensitive">
                            Case Insensitive
                        </option>

                    </select>

                    <br>


                    <input type="button"
                           value="Check and add to list"
                           class="btn btn-primary"
                           onclick="checkWord()">

                </form>

            </div>



            <!-- Algorithm 1 -->
            <div class="col-lg-3 col-md-6">

                <h2>Algorithm 1</h2>

                <p><strong>(word: palindrome?)</strong></p>

                <p id="algorithm1List"></p>

                <input type="button"
                       value="Clear the list"
                       class="btn btn-secondary"
                       onclick="clearList1()">

            </div>



            <!-- Algorithm 2 -->
            <div class="col-lg-3 col-md-6">

                <h2>Algorithm 2</h2>

                <p><strong>(word: palindrome?)</strong></p>

                <p id="algorithm2List"></p>

                <input type="button"
                       value="Clear the list"
                       class="btn btn-secondary"
                       onclick="clearList2()">

            </div>



            <!-- Algorithm 3 -->
            <div class="col-lg-3 col-md-6">

                <h2>Algorithm 3</h2>

                <p><strong>(word: palindrome?)</strong></p>

                <p id="algorithm3List"></p>

                <input type="button"
                       value="Clear the list"
                       class="btn btn-secondary"
                       onclick="clearList3()">

            </div>


        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
